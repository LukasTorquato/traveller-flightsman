[project]
name = "traveller"
version = "0.2.0"
description = "Weekly flight-deal scanner — prompt-driven Claude Code routine"
requires-python = ">=3.12"
# No runtime dependencies — traveller_math.py uses only stdlib.

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
